services:
  web:
    # Build context points to app/ relative to prod/ directory
    build:
      context: ../app
      dockerfile: Dockerfile
    # Do not expose port 4000 to the host for security. Only expose to internal docker network.
    expose:
      - "4000"
    environment:
      - MIX_ENV=prod
      - PORT=4000
      - PHX_SERVER=true
      - PHX_HOST=${PHX_HOST:-wayup.cc} # Domain name loaded from env, defaults to wayup.cc
      # Points to the local db service
      - DATABASE_URL=ecto://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db/${DB_NAME:-diary_prod}
      # Inject secret key base generated at runtime
      - SECRET_KEY_BASE
      # OAuth credentials loaded from the host environment
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - DISCORD_CLIENT_ID
      - DISCORD_CLIENT_SECRET
    depends_on:
      - db
    networks:
      - prod_network

  db:
    # Use postgres version compatible with the development environment
    image: postgres:16.0-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-diary_prod}
    volumes:
      # Persistent storage for production database data
      - db_data:/var/lib/postgresql/data
    networks:
      - prod_network

  nginx:
    image: nginx:alpine
    restart: always
    # Map host ports 80 and 443 for production HTTP/HTTPS traffic
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount production configuration files and SSL certificates
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - prod_network

volumes:
  # Named volume for Postgres database persistence
  db_data:

networks:
  # Internal bridge network for isolated communication
  prod_network:
    driver: bridge
